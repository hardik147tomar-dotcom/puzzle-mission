<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  // CONFIGURATION FOR THIS FILE:
  // Change CURRENT_STAGE to 1, 2, 3, 4, 5, 6, or 7 depending on the page
  const CURRENT_STAGE = 2; 

  const UNLOCK_DATES = {
    1: new Date(2026, 9, 1, 0, 0, 0),  // Oct 1, 12:00 AM
    2: new Date(2026, 9, 2, 0, 0, 0),  // Oct 2, 12:00 AM
    3: new Date(2026, 9, 3, 0, 0, 0),  // Oct 3, 12:00 AM
    4: null,                            // Stage 4 (scan.html) - Unlocks instantly after Stage 3
    5: new Date(2026, 9, 4, 0, 0, 0),  // Oct 4, 12:00 AM
    6: new Date(2026, 9, 5, 0, 0, 0),  // Oct 5, 12:00 AM
    7: null                             // Stage 7 - Unlocks instantly after Stage 6
  };

  document.addEventListener("DOMContentLoaded", () => {
    const username = localStorage.getItem('username');
    const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');
    const requiredPreviousStage = CURRENT_STAGE - 1;

    // 1. Force Username Entry
    if (!username) {
      window.location.href = "index.html";
      return;
    }

    // 2. Check Prerequisite Progress
    if (completedStage < requiredPreviousStage) {
      showLockOverlay(`Stage ${requiredPreviousStage} Required`, `Agent ${username}, you must complete Stage ${requiredPreviousStage} before accessing this stage.`);
      return;
    }

    // 3. Check Date Unlock Schedule
    const targetDate = UNLOCK_DATES[CURRENT_STAGE];
    const now = new Date();
    if (targetDate && now < targetDate) {
      renderCountdownOverlay(targetDate, username);
    }
  });

  function renderCountdownOverlay(targetDate, username) {
    const formattedDate = targetDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    const lockHTML = `
      <div id="timeLockScreen" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#f5f2eb; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;">
        <div style="background:#ffffff; border:1px solid #e2e8f0; padding:40px; border-radius:16px; max-width:480px; width:100%; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);">
          <div style="font-size:40px; margin-bottom:12px;">🔒</div>
          <h2 style="font-size:22px; color:#1a202c; margin-bottom:4px;">STAGE ${CURRENT_STAGE} LOCKED</h2>
          <p style="font-size:13px; color:#2b6cb0; font-weight:700; margin-bottom:12px;">AGENT: ${username}</p>
          <p style="font-size:14px; color:#718096; margin-bottom:20px;">This stage will unlock on <strong>${formattedDate}</strong>.</p>
          
          <div id="timerCountdown" style="background:#f8fafc; border:1px solid #cbd5e0; padding:16px; border-radius:10px; font-family:monospace; font-size:20px; font-weight:700; color:#2b6cb0; margin-bottom:20px;">
            00d 00h 00m 00s
          </div>

          <p style="font-size:12px; color:#a0aec0; margin-bottom:16px;">Your username and progress are saved. You can close this page and return later.</p>
          <a href="index.html" style="display:inline-block; padding:10px 20px; background:#edf2f7; color:#4a5568; border-radius:8px; text-decoration:none; font-size:13px; font-weight:600;">BACK TO HUB</a>
        </div>
      </div>
    `;

    document.body.insertAdjacentHTML('beforeend', lockHTML);

    const interval = setInterval(() => {
      const remaining = targetDate - new Date();
      if (remaining <= 0) {
        clearInterval(interval);
        const lockEl = document.getElementById('timeLockScreen');
        if (lockEl) lockEl.remove();
      } else {
        const d = Math.floor(remaining / (1000 * 60 * 60 * 24));
        const h = Math.floor((remaining / (1000 * 60 * 60)) % 24);
        const m = Math.floor((remaining / 1000 / 60) % 60);
        const s = Math.floor((remaining / 1000) % 60);
        const timerEl = document.getElementById('timerCountdown');
        if (timerEl) timerEl.innerText = `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
      }
    }, 1000);
  }

  function showLockOverlay(title, description) {
    const lockHTML = `
      <div style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#f5f2eb; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;">
        <div style="background:#ffffff; border:1px solid #e2e8f0; padding:40px; border-radius:16px; max-width:480px; width:100%; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);">
          <div style="font-size:40px; margin-bottom:12px;">🛑</div>
          <h2 style="font-size:22px; color:#1a202c; margin-bottom:8px;">${title}</h2>
          <p style="font-size:14px; color:#718096; margin-bottom:24px;">${description}</p>
          <a href="index.html" style="display:inline-block; padding:12px 24px; background:#2b6cb0; color:white; border-radius:8px; text-decoration:none; font-weight:600;">RETURN TO HUB</a>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', lockHTML);
  }
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAGE 2</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #f5f2eb; color: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
    .stage-badge { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #718096; text-transform: uppercase; margin-bottom: 16px; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 40px; border-radius: 16px; width: 100%; max-width: 560px; text-align: center; }
    h2 { color: #1a202c; margin-top: 0; font-size: 26px; margin-bottom: 24px; }
    .field-group { margin-bottom: 20px; text-align: left; }
    label { font-size: 15px; font-weight: 700; color: #4a5568; display: block; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 14px; background: #f8fafc; border: 2px solid #cbd5e0; color: #1a202c; font-size: 16px; border-radius: 8px; outline: none; }
    input[type="text"]:focus { border-color: #3182ce; background: #ffffff; }
    button { padding: 16px 28px; background: #2b6cb0; color: white; border: none; font-size: 18px; font-weight: 600; cursor: pointer; border-radius: 10px; width: 100%; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #2c5282; }
    .github-ref { margin-top: 24px; font-size: 14px; color: #718096; }
    .github-ref a { color: #3182ce; font-weight: 600; text-decoration: underline; word-break: break-all; }
    .github-ref a:hover { color: #2c5282; }
  </style>
</head>
<body>

  <div class="stage-badge">STAGE 2 OF 5</div>

  <div class="card">
    <h2>WHAT IS HARDIK'S...</h2>
    
    <div class="field-group">
      <label for="email">E-Mail:</label>
      <input type="text" id="email" placeholder="Enter email..." autocomplete="off">
    </div>

    <div class="field-group">
      <label for="location">Location:</label>
      <input type="text" id="location" placeholder="Enter location..." autocomplete="off">
    </div>

    <div class="field-group">
      <label for="twitter">X (Twitter):</label>
      <input type="text" id="twitter" placeholder="Enter handle / name..." autocomplete="off">
    </div>

    <button onclick="checkStage2()">VERIFY DETAILS</button>

    <div class="github-ref">
      GitHub for reference: <a href="https://github.com/hardik147tomar-dotcom" target="_blank" rel="noopener noreferrer">https://github.com/hardik147tomar-dotcom</a>
    </div>
  </div>

  <script>
    function checkStage2() {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const location = document.getElementById('location').value.trim().toLowerCase();
      const twitter = document.getElementById('twitter').value.trim().toLowerCase();

      const validEmail = "hardik147tomar@gmail.com";
      const validLocation = "frankfurt";
      const validTwitter = [
        "i'm no brain guy", "im no brain guy", "imnobrainguy",
        "@i'm no brain guy", "@im no brain guy", "@imnobrainguy"
      ];

      if (email === validEmail && location === validLocation && validTwitter.includes(twitter)) {
        window.location.href = "stage3.html";
      } else {
        alert("ONE OR MORE FIELDS ARE INCORRECT. Re-check all 3 entries.");
      }
    }
  </script>
</body>
</html>
