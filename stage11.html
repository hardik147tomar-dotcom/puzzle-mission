<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const CURRENT_STAGE = 11;
    const MASTER_USERNAME = "PandaSmugs";
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1555513534131998760/G0Y_mR8veWOJarUBBs52oYIjSS4LIG-a2rsSwgrHbdsQhBSK9EZiMjOFU7OrRSo_Zt3B";

    const UNLOCK_DATES = {
      1: new Date(2026, 9, 1, 0, 0, 0),
      2: new Date(2026, 9, 2, 0, 0, 0),
      3: new Date(2026, 9, 3, 0, 0, 0),
      4: null,
      5: new Date(2026, 9, 4, 0, 0, 0),
      6: new Date(2026, 9, 5, 0, 0, 0),
      7: new Date(2026, 9, 6, 0, 0, 0),
      8: new Date(2026, 9, 7, 0, 0, 0),
      9: new Date(2026, 9, 8, 0, 0, 0),
      10: new Date(2026, 9, 9, 0, 0, 0),
      11: new Date(2026, 9, 10, 0, 0, 0),
      12: new Date(2026, 9, 11, 0, 0, 0),
      13: new Date(2026, 9, 12, 0, 0, 0)
    };

    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function sendWebhook(stageNum) {
      const username = localStorage.getItem('username') || 'Unknown Agent';
      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: `🎯 **Agent ${username}** has successfully completed **Stage ${stageNum}**!` }),
          keepalive: true
        });
      } catch (e) { console.error("Webhook error:", e); }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const username = localStorage.getItem('username');
      const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');
      const requiredPreviousStage = CURRENT_STAGE - 1;

      if (!username) {
        window.location.href = "index.html";
        return;
      }

      const isMasterUser = username.trim().toLowerCase() === MASTER_USERNAME.toLowerCase();

      if (!isMasterUser && completedStage < requiredPreviousStage) {
        showLockOverlay(
          `Stage ${requiredPreviousStage} Required`,
          `Agent ${username}, you must complete Stage ${requiredPreviousStage} before accessing this stage.`
        );
        return;
      }

      const targetDate = UNLOCK_DATES[CURRENT_STAGE];
      const now = new Date();

      if (!isMasterUser && targetDate && now < targetDate) {
        renderCountdownOverlay(targetDate, username);
      }
    });

    function renderCountdownOverlay(targetDate, username) {
      const formattedDate = targetDate.toLocaleDateString('en-US', {
        month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      const lockHTML = `
        <div id="timeLockScreen" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#f5f2eb; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;">
          <div style="background:#ffffff; border:1px solid #e2e8f0; padding:40px; border-radius:16px; max-width:480px; width:100%; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);">
            <div style="font-size:40px; margin-bottom:12px;">🔒</div>
            <h2 style="font-size:22px; color:#1a202c; margin-bottom:4px;">STAGE ${CURRENT_STAGE} LOCKED</h2>
            <p style="font-size:13px; color:#2b6cb0; font-weight:700; margin-bottom:12px;">AGENT: ${username}</p>
            <p style="font-size:14px; color:#718096; margin-bottom:20px;">This stage will unlock on <strong>${formattedDate}</strong>.</p>
            <div id="timerCountdown" style="background:#f8fafc; border:1px solid #cbd5e0; padding:16px; border-radius:10px; font-family:monospace; font-size:20px; font-weight:700; color:#2b6cb0; margin-bottom:20px;">
              00d 00h 00m 00s
            </div>
            <p style="font-size:12px; color:#a0aec0; margin-bottom:16px;">Your username and progress are saved. You can close this page and return later.</p>
            <a href="index.html" style="display:inline-block; padding:10px 20px; background:#edf2f7; color:#4a5568; border-radius:8px; text-decoration:none; font-size:13px; font-weight:600;">BACK TO HUB</a>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', lockHTML);

      const interval = setInterval(() => {
        const remaining = targetDate - new Date();
        if (remaining <= 0) {
          clearInterval(interval);
          const lockEl = document.getElementById('timeLockScreen');
          if (lockEl) lockEl.remove();
        } else {
          const d = Math.floor(remaining / (1000 * 60 * 60 * 24));
          const h = Math.floor((remaining / (1000 * 60 * 60)) % 24);
          const m = Math.floor((remaining / 1000 / 60) % 60);
          const sec = Math.floor((remaining / 1000) % 60);
          const timerEl = document.getElementById('timerCountdown');
          if (timerEl) {
            timerEl.innerText = `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;
          }
        }
      }, 1000);
    }

    function showLockOverlay(title, description) {
      const lockHTML = `
        <div style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#f5f2eb; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;">
          <div style="background:#ffffff; border:1px solid #e2e8f0; padding:40px; border-radius:16px; max-width:480px; width:100%; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);">
            <div style="font-size:40px; margin-bottom:12px;">🛑</div>
            <h2 style="font-size:22px; color:#1a202c; margin-bottom:8px;">${title}</h2>
            <p style="font-size:14px; color:#718096; margin-bottom:24px;">${description}</p>
            <a href="index.html" style="display:inline-block; padding:12px 24px; background:#2b6cb0; color:white; border-radius:8px; text-decoration:none; font-weight:600;">RETURN TO HUB</a>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', lockHTML);
    }

    async function checkAnswer() {
      const input = document.getElementById('answer');
      const status = document.getElementById('status');
      const button = document.getElementById('verifyBtn');
      const normalized = input.value.trim().toLowerCase().replace(/\s+/g, ' ');

      if (!normalized) {
        status.textContent = "ENTER THE STREET NAME.";
        status.style.color = "#d69e2e";
        return;
      }

      button.disabled = true;
      const hash = await sha256(normalized);
      const validHash = "f7c03a69eb688d7dfe85f12ed4f986cb1cf29c7b7f52724d2783deb859757a4f";

      if (hash === validHash) {
        status.textContent = "VERIFIED. STREET IDENTIFIED.";
        status.style.color = "#38a169";
        localStorage.setItem('completed_stage', '11');
        await sendWebhook(11);
        setTimeout(() => { window.location.href = "stage12.html"; }, 900);
      } else {
        status.textContent = "INCORRECT STREET. RE-EXAMINE THE LOCATION.";
        status.style.color = "#e53e3e";
        button.disabled = false;
      }
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAGE 11 - STREET RECON</title>
  <style>
    * { box-sizing: border-box; }
    body { background:#f5f2eb; color:#2d3748; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:16px; }
    .stage-badge { font-size:14px; font-weight:700; letter-spacing:2px; color:#718096; text-transform:uppercase; margin-bottom:12px; }
    .card { background:#fff; border:1px solid #e2e8f0; box-shadow:0 10px 25px -5px rgba(0,0,0,.05); padding:32px; border-radius:16px; width:100%; max-width:620px; text-align:center; }
    h2 { color:#1a202c; margin:0 0 8px; font-size:22px; }
    p.hint { font-size:14px; color:#718096; margin:0 0 22px; line-height:1.5; }
    .image-wrap { background:#f8fafc; border:1px solid #cbd5e0; border-radius:12px; padding:10px; margin-bottom:22px; }
    .image-wrap img { display:block; width:100%; max-height:380px; object-fit:contain; border-radius:8px; }
    .image-note { font-size:12px; color:#a0aec0; margin-top:8px; }
    input { width:100%; padding:14px; margin-bottom:12px; border:2px solid #cbd5e0; font-size:16px; border-radius:8px; text-align:center; outline:none; }
    input:focus { border-color:#3182ce; }
    button { padding:14px; background:#2b6cb0; color:#fff; border:none; font-size:16px; font-weight:600; cursor:pointer; border-radius:8px; width:100%; }
    button:hover { background:#2c5282; }
    button:disabled { background:#a0aec0; cursor:not-allowed; }
    #status { margin-top:16px; font-size:14px; font-weight:700; min-height:20px; }
  </style>
</head>
<body>
  <div class="stage-badge">STAGE 11 OF 13</div>
  <div class="card">
    <h2>[ STAGE 11: FOLLOW THE TRAIL ]</h2>
    <p class="hint">Identify the business shown in the photograph, then determine the street on which it is located.</p>

    <div class="image-wrap">
      <img src="captain-quackenbush.jpg" alt="Location photograph">
      <div class="image-note">Study the photograph carefully. The business sign is your first clue.</div>
    </div>

    <input type="text" id="answer" placeholder="Enter street name..." autocomplete="off" onkeydown="if(event.key==='Enter') checkAnswer()">
    <button id="verifyBtn" onclick="checkAnswer()">VERIFY STREET</button>
    <div id="status"></div>
  </div>
</body>
</html>
