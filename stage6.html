<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const CURRENT_STAGE = 6; 
    const MASTER_USERNAME = "PandaSmugs";
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1555513534131998760/G0Y_mR8veWOJarUBBs52oYIjSS4LIG-a2rsSwgrHbdsQhBSK9EZiMjOFU7OrRSo_Zt3B";

    const UNLOCK_DATES = {
      1: new Date(2026, 9, 1, 0, 0, 0),
      2: new Date(2026, 9, 2, 0, 0, 0),
      3: new Date(2026, 9, 3, 0, 0, 0),
      4: null,                            
      5: new Date(2026, 9, 4, 0, 0, 0),
      6: new Date(2026, 9, 5, 0, 0, 0),
      7: new Date(2026, 9, 6, 0, 0, 0),
      8: new Date(2026, 9, 7, 0, 0, 0),
      9: new Date(2026, 9, 8, 0, 0, 0),
      10: null                             
    };

    async function sendWebhook(stageNum) {
      if (!WEBHOOK_URL || WEBHOOK_URL === "YOUR_WEBHOOK_URL_HERE") return;
      const username = localStorage.getItem('username') || 'Unknown Agent';
      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content: `🎯 **Agent ${username}** has successfully completed **Stage ${stageNum}**!`
          }),
          keepalive: true
        });
      } catch (e) {
        console.error("Webhook error:", e);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const username = localStorage.getItem('username');
      const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');
      const requiredPreviousStage = CURRENT_STAGE - 1;

      if (!username) { window.location.href = "index.html"; return; }
      const isMasterUser = username.trim().toLowerCase() === MASTER_USERNAME.toLowerCase();

      if (!isMasterUser && completedStage < requiredPreviousStage) {
        alert(`Agent ${username}, you must complete Stage ${requiredPreviousStage} first.`);
        window.location.href = "index.html";
      }
    });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAGE 6 - EMBLEM VERIFICATION</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #f5f2eb; color: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
    .stage-badge { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #718096; text-transform: uppercase; margin-bottom: 16px; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 32px; border-radius: 16px; width: 100%; max-width: 520px; text-align: center; }
    h2 { color: #1a202c; margin-top: 0; font-size: 22px; margin-bottom: 8px; }
    p.instructions { font-size: 14px; color: #718096; margin-bottom: 20px; }
    
    .canvas-container { position: relative; width: 300px; height: 300px; margin: 0 auto 20px auto; border: 2px solid #cbd5e0; border-radius: 12px; background: #ffffff; overflow: hidden; }
    canvas { position: absolute; top: 0; left: 0; width: 300px; height: 300px; touch-action: none; }
    #refCanvas { opacity: 0; pointer-events: none; }
    
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px 16px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 8px; transition: background 0.2s; }
    .btn-submit { background: #2b6cb0; color: white; }
    .btn-submit:hover { background: #2c5282; }
    .btn-clear { background: #edf2f7; color: #4a5568; }
    .btn-clear:hover { background: #e2e8f0; }
    
    #status { margin-top: 16px; font-size: 15px; font-weight: 600; word-break: break-word; }
  </style>
</head>
<body>

  <div class="stage-badge">STAGE 6</div>

  <div class="card">
    <h2>DRAW THE AGENCY EMBLEM</h2>
    <p class="instructions">Draw the double-arch symbol inside the canvas below.</p>

    <div class="canvas-container">
      <canvas id="refCanvas" width="300" height="300"></canvas>
      <canvas id="drawCanvas" width="300" height="300"></canvas>
    </div>

    <div class="btn-group">
      <button class="btn-clear" onclick="clearCanvas()">CLEAR</button>
      <button class="btn-submit" onclick="verifyDrawing()">VERIFY EMBLEM</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d');
    const refCanvas = document.getElementById('refCanvas');
    const refCtx = refCanvas.getContext('2d');

    let isDrawing = false;

    drawCtx.lineWidth = 12;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    drawCtx.strokeStyle = '#1a202c';

    refCtx.lineWidth = 12;
    refCtx.lineCap = 'round';
    refCtx.lineJoin = 'round';
    refCtx.strokeStyle = '#2b6cb0';

    function drawTargetEmblem(ctx) {
      ctx.clearRect(0, 0, 300, 300);
      ctx.beginPath();
      ctx.moveTo(150, 175); ctx.lineTo(150, 115);
      ctx.moveTo(98, 215);  ctx.bezierCurveTo(90, 138, 126, 128, 150, 175);
      ctx.moveTo(150, 175); ctx.bezierCurveTo(174, 128, 210, 138, 202, 215);
      ctx.stroke();
    }

    drawTargetEmblem(refCtx);

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);
      drawCtx.beginPath();
      drawCtx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      drawCtx.lineTo(pos.x, pos.y);
      drawCtx.stroke();
    }

    function stopDrawing() { isDrawing = false; }

    drawCanvas.addEventListener('mousedown', startDrawing);
    drawCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    drawCanvas.addEventListener('touchstart', startDrawing);
    drawCanvas.addEventListener('touchmove', draw);
    window.addEventListener('touchend', stopDrawing);

    function clearCanvas() {
      drawCtx.clearRect(0, 0, 300, 300);
      document.getElementById('status').innerText = '';
    }

    function getNormalizedCanvas(sourceCanvas) {
      const ctx = sourceCanvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, 300, 300).data;

      let minX = 300, maxX = 0, minY = 300, maxY = 0, totalPixels = 0;

      for (let y = 0; y < 300; y++) {
        for (let x = 0; x < 300; x++) {
          const alpha = imgData[(y * 300 + x) * 4 + 3];
          if (alpha > 50) {
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
            totalPixels++;
          }
        }
      }

      if (totalPixels < 100) return null;

      const cropWidth = Math.max(maxX - minX + 1, 10);
      const cropHeight = Math.max(maxY - minY + 1, 10);

      const normCanvas = document.createElement('canvas');
      normCanvas.width = 300; normCanvas.height = 300;
      const normCtx = normCanvas.getContext('2d');

      const scale = Math.min(180 / cropWidth, 180 / cropHeight);
      const destWidth = cropWidth * scale;
      const destHeight = cropHeight * scale;

      normCtx.drawImage(
        sourceCanvas, 
        minX, minY, cropWidth, cropHeight, 
        (300 - destWidth) / 2, (300 - destHeight) / 2, destWidth, destHeight
      );

      return normCanvas;
    }

    async function verifyDrawing() {
      const status = document.getElementById('status');
      const userNormCanvas = getNormalizedCanvas(drawCanvas);

      if (!userNormCanvas) {
        status.style.color = "#e53e3e";
        status.innerText = "REJECTED: Drawing is empty or incomplete!";
        return;
      }

      const refNormCanvas = getNormalizedCanvas(refCanvas);
      const GRID_SIZE = 32;
      const CELL_SIZE = 300 / GRID_SIZE;

      const userData = userNormCanvas.getContext('2d').getImageData(0, 0, 300, 300).data;
      const refData = refNormCanvas.getContext('2d').getImageData(0, 0, 300, 300).data;

      let userGrid = new Array(GRID_SIZE * GRID_SIZE).fill(false);
      let refGrid = new Array(GRID_SIZE * GRID_SIZE).fill(false);

      for (let y = 0; y < 300; y++) {
        for (let x = 0; x < 300; x++) {
          const pixelIndex = (y * 300 + x) * 4;
          const gridIndex = Math.floor(y / CELL_SIZE) * GRID_SIZE + Math.floor(x / CELL_SIZE);

          if (userData[pixelIndex + 3] > 50) userGrid[gridIndex] = true;
          if (refData[pixelIndex + 3] > 50) refGrid[gridIndex] = true;
        }
      }

      let intersection = 0, union = 0;
      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        if (userGrid[i] && refGrid[i]) intersection++;
        if (userGrid[i] || refGrid[i]) union++;
      }

      const matchScore = Math.round((intersection / union) * 100);
      const PASS_THRESHOLD = 40;

      if (matchScore >= PASS_THRESHOLD) {
        status.style.color = "#38a169";
        status.innerText = `VERIFIED! Match Score: ${matchScore}%`;
        localStorage.setItem('completed_stage', '6');
        await sendWebhook(6);
        setTimeout(() => { window.location.href = "stage7.html"; }, 1200);
      } else {
        status.style.color = "#e53e3e";
        status.innerText = `REJECTED: Match Score ${matchScore}%. (Requires ${PASS_THRESHOLD}%+)`;
      }
    }
  </script>
</body>
</html>
