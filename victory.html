<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHALLENGE COMPLETE - VICTORY</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f5f2eb;
      color: #2d3748;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .icon-box {
      width: 72px;
      height: 72px;
      background: #f0fff4;
      border: 2px solid #38a169;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 32px;
    }

    h1 {
      color: #1a202c;
      font-size: 26px;
      margin-bottom: 12px;
    }

    p {
      color: #718096;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .flag-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e0;
      padding: 16px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: #2b6cb0;
      margin-bottom: 28px;
      word-break: break-all;
    }

    .btn {
      padding: 14px 28px;
      background: #2b6cb0;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      width: 100%;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #2c5282;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon-box">🏆</div>
  <h1>ALL STAGES CLEAR</h1>
  <p>Authentication complete. You have successfully cleared all OSINT, local machine learning, biometric liveness, and emblem verification challenges.</p>

  <div class="flag-box">
    FLAG{PHANTOM_GANG_AUTHENTICATED}
  </div>

  <a href="index.html" class="btn">RESTART CHALLENGE</a>
</div>

</body>
</html>
