<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAGE 3</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #f5f2eb; color: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
    .stage-badge { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #718096; text-transform: uppercase; margin-bottom: 16px; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 40px; border-radius: 16px; width: 100%; max-width: 520px; text-align: center; }
    h2 { color: #1a202c; margin-top: 0; font-size: 24px; margin-bottom: 20px; }
    .preview-box { width: 220px; height: 220px; border: 2px dashed #cbd5e0; border-radius: 16px; background: #f8fafc; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; cursor: pointer; overflow: hidden; position: relative; }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .plus-icon { font-size: 48px; color: #a0aec0; font-weight: 300; }
    input[type="file"] { display: none; }
    button { padding: 16px 28px; background: #2b6cb0; color: white; border: none; font-size: 18px; font-weight: 600; cursor: pointer; border-radius: 10px; width: 100%; transition: background 0.2s; }
    button:hover { background: #2c5282; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 15px; font-weight: 600; color: #d69e2e; }
  </style>
</head>
<body>

  <div class="stage-badge">STAGE 3 OF 5</div>

  <div class="card">
    <h2>UPLOAD A PICTURE OF A FLYING BIRD</h2>

    <div class="preview-box" onclick="document.getElementById('fileInput').click()">
      <span class="plus-icon" id="plusIcon">+</span>
      <img id="imagePreview" style="display:none;" />
    </div>

    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
    <button id="verifyBtn" onclick="verifyImage()">VERIFY PHOTO</button>
    <div id="status"></div>
  </div>

  <script>
    let selectedFile = null;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      selectedFile = file;

      const reader = new FileReader();
      reader.onload = (e) => {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('plusIcon').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    // Extract EXIF Date from JPEG
    function getExifDate(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const view = new DataView(e.target.result);
            if (view.getUint16(0, false) !== 0xFFD8) return resolve(null);
            let length = view.byteLength, offset = 2;
            while (offset < length) {
              if (view.getUint16(offset+2, false) <= 8) return resolve(null);
              let marker = view.getUint16(offset, false);
              offset += 2;
              if (marker == 0xFFE1) {
                if (view.getUint32(offset += 2, false) !== 0x45786966) return resolve(null);
                let little = view.getUint16(offset += 6, false) == 0x4949;
                offset += view.getUint32(offset + 4, little);
                let tags = view.getUint16(offset, little);
                offset += 2;
                for (let i = 0; i < tags; i++) {
                  let tag = view.getUint16(offset + (i * 12), little);
                  if (tag == 0x9003 || tag == 0x0132) { // DateTimeOriginal or DateTime
                    let tOffset = view.getUint32(offset + (i * 12) + 8, little);
                    let str = "";
                    for (let j = 0; j < 10; j++) str += String.fromCharCode(view.getUint8(tOffset + j));
                    return resolve(str.replace(/:/g, '-')); // Format: YYYY-MM-DD
                  }
                }
              } else {
                offset += view.getUint16(offset, false);
              }
            }
          } catch(err) {}
          return resolve(null);
        };
        reader.readAsArrayBuffer(file);
      });
    }

    async function verifyImage() {
      const status = document.getElementById('status');
      const btn = document.getElementById('verifyBtn');

      if (!selectedFile) {
        alert("Please tap the preview box to upload a photo first.");
        return;
      }

      btn.disabled = true;
      status.style.color = "#d69e2e";
      status.innerText = "Checking photo metadata...";

      // 1. Metadata check: verify photo date matches today
      const exifDate = await getExifDate(selectedFile);
      const today = new Date().toISOString().split('T')[0];

      if (exifDate && exifDate !== today) {
        status.style.color = "#e53e3e";
        status.innerText = `REJECTED: Photo was taken on ${exifDate}. Must be clicked today (${today})!`;
        btn.disabled = false;
        return;
      }

      status.innerText = "Analyzing image with Gemini AI...";

      // 2. Compress and prepare image
      const img = new Image();
      img.src = URL.createObjectURL(selectedFile);

      img.onload = async () => {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height, maxDim = 800;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }

        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const base64Image = canvas.toDataURL('image/jpeg', 0.7);

        try {
          const res = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ imageBase64: base64Image })
          });

          const data = await res.json();

          if (res.ok && data.correct) {
            window.location.href = "scan.html";
          } else if (data.error) {
            status.style.color = "#e53e3e";
            status.innerText = "API Error: " + data.error;
            btn.disabled = false;
          } else {
            status.style.color = "#e53e3e";
            status.innerText = "REJECTED BY AI: Image does not contain a flying bird.";
            btn.disabled = false;
          }
        } catch (e) {
          status.style.color = "#e53e3e";
          status.innerText = "Network failure while reaching server.";
          btn.disabled = false;
        }
      };
    }
  </script>
</body>
</html>
