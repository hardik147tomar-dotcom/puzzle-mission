<script>
const CURRENT_STAGE=8;

const UNLOCK_DATE=new Date(2026,9,7,0,0,0);

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
async function sendWebhook(stageNum) {
  const username = localStorage.getItem("username") || "Unknown Agent";
  try {
    await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({content:`🎯 **Agent ${username}** has successfully completed **Stage ${stageNum}**!`}),keepalive:true});
  } catch(e) { console.error("Webhook error:",e); }
}
function showLockOverlay(title, description) {
  document.body.insertAdjacentHTML("beforeend",`
    <div class="lock-screen"><div class="lock-card">
      <div class="lock-icon">🛑</div><h2>${title}</h2><p>${description}</p>
      <a href="index.html" class="hub-button">RETURN TO HUB</a>
    </div></div>`);
}
function renderCountdownOverlay(targetDate, username) {
  const formattedDate=targetDate.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"});
  document.body.insertAdjacentHTML("beforeend",`
    <div id="timeLockScreen" class="lock-screen"><div class="lock-card">
      <div class="lock-icon">🔒</div><h2>STAGE ${CURRENT_STAGE} LOCKED</h2>
      <p class="agent-name">AGENT: ${username}</p>
      <p>This stage will unlock on <strong>${formattedDate}</strong>.</p>
      <div id="timerCountdown" class="countdown">00d 00h 00m 00s</div>
      <p class="small-note">Your username and progress are saved. You can close this page and return later.</p>
      <a href="index.html" class="back-button">BACK TO HUB</a>
    </div></div>`);
  const interval=setInterval(()=>{
    const r=targetDate-new Date();
    if(r<=0){clearInterval(interval);document.getElementById("timeLockScreen")?.remove();return;}
    const d=Math.floor(r/86400000),h=Math.floor(r/3600000)%24,m=Math.floor(r/60000)%60,s=Math.floor(r/1000)%60;
    const el=document.getElementById("timerCountdown");
    if(el) el.textContent=`${String(d).padStart(2,"0")}d ${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m ${String(s).padStart(2,"0")}s`;
  },1000);
}
document.addEventListener("DOMContentLoaded",()=>{
  const username=localStorage.getItem("username");
  const completed=parseInt(localStorage.getItem("completed_stage")||"0",10);
  if(!username){window.location.href="index.html";return;}
  const master=username.trim().toLowerCase()===MASTER_USERNAME.toLowerCase();
  const required=CURRENT_STAGE-1;
  if(!master && completed<required){
    showLockOverlay(`Stage ${required} Required`,`Agent ${username}, you must complete Stage ${required} before accessing this stage.`);
    return;
  }
  if(!master && UNLOCK_DATE && new Date()<UNLOCK_DATE) renderCountdownOverlay(UNLOCK_DATE,username);
});
