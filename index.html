<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDENTITY VERIFICATION</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #f5f2eb;
      color: #2d3748;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    h2 {
      color: #1a202c;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
    }

    p.subtitle {
      font-size: 13px;
      color: #718096;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }

    /* Welcome Back Info Box */
    .user-info-box {
      background: #f0f4f8;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .info-label {
      font-size: 11px;
      font-weight: 700;
      color: #a0aec0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .info-username {
      font-size: 20px;
      font-weight: 800;
      color: #2b6cb0;
      margin: 4px 0;
    }

    .info-stage {
      font-size: 12px;
      color: #718096;
      font-weight: 600;
    }

    /* Form Elements */
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #4a5568;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #2b6cb0;
    }

    /* Buttons */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }

    .btn-primary {
      background: #2b6cb0;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #2c5282;
    }

    .btn-secondary {
      background: #edf2f7;
      color: #4a5568;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-restart {
      background: #f7fafc;
      color: #4a5568;
      border: 1px solid #cbd5e0;
    }

    .btn-restart:hover {
      background: #edf2f7;
      color: #1a202c;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🕵️</div>
    <h2>IDENTITY VERIFICATION</h2>
    <p class="subtitle">Enter your username or agent codename to initialize your challenge session.</p>

    <!-- NEW USER FORM -->
    <div id="loginForm" style="display: none;">
      <div class="input-group">
        <label for="usernameInput">Agent Codename</label>
        <input type="text" id="usernameInput" placeholder="e.g. PandaSmugs" autocomplete="off">
      </div>
      <button class="btn-primary" onclick="startNewSession()">START CHALLENGE</button>
    </div>

    <!-- RETURNING USER CARD -->
    <div id="welcomeCard" style="display: none;">
      <div class="user-info-box">
        <div class="info-label">WELCOME BACK</div>
        <div class="info-username" id="displayUsername">---</div>
        <div class="info-stage" id="displayStage">Current Stage: 1</div>
      </div>

      <div class="btn-container">
        <button class="btn-primary" onclick="resumeChallenge()">RESUME CHALLENGE</button>
        <button class="btn-restart" onclick="restartFromStage1()">START AGAIN FROM STAGE 1</button>
        <button class="btn-secondary" onclick="switchUsername()">SWITCH USERNAME</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const username = (localStorage.getItem('username') || '').trim();
      const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');

      if (username) {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('welcomeCard').style.display = 'block';

        document.getElementById('displayUsername').innerText = username;

        // Stage Display Logic
        const currentStage = Math.min(completedStage + 1, 7);
        document.getElementById('displayStage').innerText = currentStage > 6 ? 'Completed All Stages' : `Current Stage: ${currentStage}`;
      } else {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('welcomeCard').style.display = 'none';
      }
    });

    // Start New Session
    function startNewSession() {
      const input = document.getElementById('usernameInput').value.trim();
      if (!input) {
        alert("Please enter a username!");
        return;
      }
      localStorage.setItem('username', input);
      localStorage.setItem('completed_stage', '0');
      window.location.href = "stage1.html";
    }

    // Resume Challenge Button
    function resumeChallenge() {
      const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');
      const targetStage = completedStage + 1;

      if (targetStage >= 7) {
        window.location.href = "victory.html";
      } else {
        window.location.href = `stage${targetStage}.html`;
      }
    }

    // NEW: Start Again From Stage 1 Button
    function restartFromStage1() {
      localStorage.setItem('completed_stage', '0');
      window.location.href = "stage1.html";
    }

    // Switch Username Button
    function switchUsername() {
      localStorage.removeItem('username');
      localStorage.removeItem('completed_stage');
      location.reload();
    }
  </script>

</body>
</html>
