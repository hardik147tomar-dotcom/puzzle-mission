<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGENT AUTHENTICATION HUB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f5f2eb;
      color: #2d3748;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border-radius: 16px;
      padding: 36px 32px;
      text-align: center;
    }

    .logo-badge {
      font-size: 36px;
      margin-bottom: 12px;
    }

    h1 {
      color: #1a202c;
      font-size: 22px;
      margin-bottom: 8px;
    }

    p.subtext {
      font-size: 14px;
      color: #718096;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #4a5568;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e0;
      border-radius: 10px;
      font-size: 16px;
      color: #2d3748;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #2b6cb0;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #2b6cb0;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #2c5282;
    }

    .btn-secondary {
      background: #edf2f7;
      color: #4a5568;
      border: 1px solid #cbd5e0;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    #status {
      font-size: 13px;
      font-weight: 600;
      color: #e53e3e;
      margin-top: 12px;
      min-height: 18px;
    }

    .returning-box {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .username-display {
      font-weight: 700;
      color: #2b6cb0;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo-badge">🕵️‍♂️</div>
  <h1>IDENTITY VERIFICATION</h1>
  <p class="subtext">Enter your username or agent codename to initialize your challenge session.</p>

  <!-- Section for returning users -->
  <div id="returningUserSection" style="display: none;">
    <div class="returning-box">
      <div style="font-size: 12px; color: #718096; text-transform: uppercase; margin-bottom: 4px;">Welcome Back</div>
      <div id="displayUsername" class="username-display">Agent</div>
      <div id="displayProgress" style="font-size: 13px; color: #4a5568; margin-top: 6px;">Progress: Stage 1</div>
    </div>
    <button class="btn" onclick="resumeChallenge()">RESUME CHALLENGE</button>
    <button class="btn btn-secondary" onclick="switchUser()">SWITCH USERNAME</button>
  </div>

  <!-- Form for new or editing users -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="input-group">
      <label for="usernameInput">Username / Codename</label>
      <input type="text" id="usernameInput" placeholder="e.g. Agent_Phantom" autocomplete="off" required>
    </div>
    <button type="submit" class="btn">START CHALLENGE</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const stagePages = {
    0: "stage1.html",
    1: "stage2.html",
    2: "stage3.html",
    3: "scan.html",   // Stage 4
    4: "stage5.html",
    5: "stage6.html",
    6: "stage7.html",
    7: "victory.html"
  };

  document.addEventListener("DOMContentLoaded", () => {
    const savedUser = localStorage.getItem('username');
    const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');

    if (savedUser) {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('returningUserSection').style.display = 'block';
      document.getElementById('displayUsername').innerText = savedUser;
      
      const currentStageNum = completedStage >= 7 ? "VICTORY REACHED" : `Current Stage: ${completedStage + 1}`;
      document.getElementById('displayProgress').innerText = currentStageNum;
    }
  });

  function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('usernameInput').value.trim();

    if (!username) {
      document.getElementById('status').innerText = "Please enter a valid username.";
      return;
    }

    // Save username & initialize stage if first time
    localStorage.setItem('username', username);
    if (!localStorage.getItem('completed_stage')) {
      localStorage.setItem('completed_stage', '0');
    }

    const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');
    window.location.href = stagePages[completedStage] || "stage1.html";
  }

  function resumeChallenge() {
    const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');
    window.location.href = stagePages[completedStage] || "stage1.html";
  }

  function switchUser() {
    document.getElementById('returningUserSection').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('usernameInput').value = '';
    document.getElementById('usernameInput').focus();
  }
</script>
</body>
</html>
