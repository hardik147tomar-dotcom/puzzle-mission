<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STAGE 1: THE ENTRY CODE</title>
  <style>
    body { background: #0b0e14; color: #58a6ff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .morse { color: #8b949e; font-size: 14px; letter-spacing: 2px; text-align: center; max-width: 80%; margin-bottom: 30px; }
    .card { background: #161b22; border: 1px solid #30363d; padding: 30px; border-radius: 8px; width: 340px; text-align: center; }
    input { width: 90%; padding: 10px; margin: 15px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; font-family: monospace; border-radius: 4px; text-align: center; }
    button { padding: 10px 20px; background: #238636; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="morse">--. . - / - .... .-. --- ..- --. .... / - .... . / - .... .. .-. -.. / .-. .. -.. -.. .-.. .</div>

  <div class="card">
    <h3>[ GATEWAY RIDDLE #1 ]</h3>
    <p>I speak without a mouth and hear without ears. I have no body, but I come alive with wind. What am I?</p>
    <input type="text" id="answer" placeholder="Enter answer..." autocomplete="off">
    <br>
    <button onclick="checkAnswer()">SUBMIT</button>
  </div>

  <script>
    function checkAnswer() {
      const val = document.getElementById('answer').value.trim().toLowerCase();
      if (val === 'echo') {
        window.location.href = "stage2.html";
      } else {
        alert("ACCESS DENIED: Incorrect phrase.");
      }
    }
  </script>
</body>
</html>
