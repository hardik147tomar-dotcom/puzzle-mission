<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const CURRENT_STAGE = 5;
    const MASTER_USERNAME = "PandaSmugs";
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1555513534131998760/G0Y_mR8veWOJarUBBs52oYIjSS4LIG-a2rsSwgrHbdsQhBSK9EZiMjOFU7OrRSo_Zt3B";

    const UNLOCK_DATES = {
      1: new Date(2026, 9, 1, 0, 0, 0),
      2: new Date(2026, 9, 2, 0, 0, 0),
      3: new Date(2026, 9, 3, 0, 0, 0),
      4: null,
      5: new Date(2026, 9, 4, 0, 0, 0),
      6: new Date(2026, 9, 5, 0, 0, 0),
      7: new Date(2026, 9, 6, 0, 0, 0),
      8: new Date(2026, 9, 7, 0, 0, 0),
      9: new Date(2026, 9, 8, 0, 0, 0),
      10: null
    };

    async function sendWebhook(stageNum) {
      if (!WEBHOOK_URL || WEBHOOK_URL === "YOUR_WEBHOOK_URL_HERE") return;
      const username = localStorage.getItem('username') || 'Unknown Agent';
      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content: `🎯 **Agent ${username}** has successfully completed **Stage ${stageNum}**!`
          }),
          keepalive: true
        });
      } catch (e) {
        console.error("Webhook error:", e);
      }
    }

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    document.addEventListener("DOMContentLoaded", () => {
      const username = localStorage.getItem('username');
      const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');

      if (!username) { window.location.href = "index.html"; return; }
      const isMasterUser = username.trim().toLowerCase() === MASTER_USERNAME.toLowerCase();
      if (!isMasterUser && completedStage < (CURRENT_STAGE - 1)) {
        alert(`Agent ${username}, you must complete Stage ${CURRENT_STAGE - 1} first.`);
        window.location.href = "index.html";
      }
    });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAGE 5 - ANAGRAM PUZZLE</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #f5f2eb; color: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
    .stage-badge { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #718096; text-transform: uppercase; margin-bottom: 12px; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 32px; border-radius: 16px; width: 100%; max-width: 520px; text-align: center; }
    h2 { color: #1a202c; margin-top: 0; font-size: 22px; margin-bottom: 8px; }
    p.hint { font-size: 14px; color: #718096; margin-bottom: 20px; line-height: 1.5; }
    .anagram-box { background: #0f172a; color: #38bdf8; font-family: monospace; padding: 18px; border-radius: 10px; font-size: 22px; font-weight: bold; letter-spacing: 6px; margin-bottom: 20px; }
    input[type="text"] { width: 100%; padding: 14px; margin-bottom: 12px; border: 2px solid #cbd5e0; font-size: 16px; border-radius: 8px; text-align: center; outline: none; }
    input[type="text"]:focus { border-color: #3182ce; }
    button { padding: 14px; background: #2b6cb0; color: white; border: none; font-size: 16px; font-weight: 600; cursor: pointer; border-radius: 8px; width: 100%; }
  </style>
</head>
<body>

  <div class="stage-badge">STAGE 5</div>

  <div class="card">
    <h2>[ STAGE 5: ANAGRAM RECON ]</h2>
    <p class="hint">Unscramble the target word to proceed to Stage 6.</p>

    <div class="anagram-box">W O D A H S</div>

    <input type="text" id="answer" placeholder="Enter unscrambled word..." autocomplete="off">
    <button onclick="checkAnswer()">VERIFY WORD</button>
  </div>

  <script>
    async function checkAnswer() {
      const val = document.getElementById('answer').value.trim().toLowerCase();
      const hashed = await sha256(val);

      // SHA-256 Hash of "shadow"
      if (hashed === "222e92e591786f56e0e02c6109e9e144a8fb92797bf6f3a7fa48d79a29e18141") {
        localStorage.setItem('completed_stage', '5');
        await sendWebhook(5);
        window.location.href = "stage6.html";
      } else {
        alert("INCORRECT ANAGRAM. Unscramble the letters correctly!");
      }
    }
  </script>
</body>
</html>
