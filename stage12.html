<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const CURRENT_STAGE = 12;
    const MASTER_USERNAME = "PandaSmugs";
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1555513534131998760/G0Y_mR8veWOJarUBBs52oYIjSS4LIG-a2rsSwgrHbdsQhBSK9EZiMjOFU7OrRSo_Zt3B";

    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function sendWebhook(stageNum) {
      const username = localStorage.getItem('username') || 'Unknown Agent';
      try {
        await fetch(WEBHOOK_URL, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({content:`🎯 **Agent ${username}** has successfully completed **Stage ${stageNum}**!`}), keepalive:true
        });
      } catch (e) { console.error("Webhook error:", e); }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const username = localStorage.getItem('username');
      const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');
      if (!username) { window.location.href = "index.html"; return; }
      const isMasterUser = username.trim().toLowerCase() === MASTER_USERNAME.toLowerCase();
      if (!isMasterUser && completedStage < CURRENT_STAGE - 1) {
        alert(`Agent ${username}, you must complete Stage ${CURRENT_STAGE - 1} first.`);
        window.location.href = "index.html";
      }
    });

    async function checkAnswer() {
      const input = document.getElementById('answer');
      const status = document.getElementById('status');
      const button = document.getElementById('verifyBtn');
      const normalized = input.value.trim().toLowerCase().replace(/\s+/g, ' ');
      if (!normalized) { status.textContent="ENTER THE CITY."; status.style.color="#d69e2e"; return; }
      button.disabled = true;
      const hash = await sha256(normalized);
      const validHash = "c7c1319276e936c8d64f1d5ed80cd8a0cf54e6dea7b0125533eb4163e03a2c11";
      if (hash === validHash) {
        status.textContent="VERIFIED. CITY IDENTIFIED.";
        status.style.color="#38a169";
        localStorage.setItem('completed_stage','12');
        await sendWebhook(12);
        setTimeout(() => { window.location.href="stage13.html"; }, 900);
      } else {
        status.textContent="INCORRECT CITY. FOLLOW THE LOCATION TRAIL.";
        status.style.color="#e53e3e";
        button.disabled=false;
      }
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAGE 12 - CITY RECON</title>
  <style>
    *{box-sizing:border-box} body{background:#f5f2eb;color:#2d3748;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px}.stage-badge{font-size:14px;font-weight:700;letter-spacing:2px;color:#718096;text-transform:uppercase;margin-bottom:12px}.card{background:#fff;border:1px solid #e2e8f0;box-shadow:0 10px 25px -5px rgba(0,0,0,.05);padding:32px;border-radius:16px;width:100%;max-width:520px;text-align:center}h2{color:#1a202c;margin:0 0 8px;font-size:22px}p.hint{font-size:14px;color:#718096;margin:0 0 24px;line-height:1.5}.clue{background:#f8fafc;border:1px solid #cbd5e0;padding:18px;border-radius:10px;margin-bottom:24px;font-family:monospace;font-size:14px;color:#2d3748;text-align:left}.clue strong{color:#1a202c}input{width:100%;padding:14px;margin-bottom:12px;border:2px solid #cbd5e0;font-size:16px;border-radius:8px;text-align:center;outline:none}input:focus{border-color:#3182ce}button{padding:14px;background:#2b6cb0;color:#fff;border:none;font-size:16px;font-weight:600;cursor:pointer;border-radius:8px;width:100%}button:hover{background:#2c5282}button:disabled{background:#a0aec0;cursor:not-allowed}#status{margin-top:16px;font-size:14px;font-weight:700;min-height:20px}
  </style>
</head>
<body>
  <div class="stage-badge">STAGE 12 OF 13</div>
  <div class="card">
    <h2>[ STAGE 12: WHERE ARE YOU? ]</h2>
    <p class="hint">You have the business and the street. Use those clues to determine the city.</p>
    <div class="clue"><strong>LOCATION CLUE</strong><br><br>Business: the coffeehouse from Stage 11<br>Street: the street you just identified</div>
    <input type="text" id="answer" placeholder="Enter city..." autocomplete="off" onkeydown="if(event.key==='Enter') checkAnswer()">
    <button id="verifyBtn" onclick="checkAnswer()">VERIFY CITY</button>
    <div id="status"></div>
  </div>
</body>
</html>
