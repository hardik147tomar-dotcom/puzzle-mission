<!DOCTYPE html>
<html lang="en">
<head>
  <script>
      // =========================================================
    // CONFIGURATION FOR THIS FILE

    const CURRENT_STAGE = 9; // Final Victory Stage
    const MASTER_USERNAME = "PandaSmugs"; // Master bypass username
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1555513534131998760/G0Y_mR8veWOJarUBBs52oYIjSS4LIG-a2rsSwgrHbdsQhBSK9EZiMjOFU7OrRSo_Zt3B"; // Insert your Webhook URL here

    const UNLOCK_DATES = {
      1: new Date(2026, 9, 1, 0, 0, 0),  // Oct 1, 12:00 AM
      2: new Date(2026, 9, 2, 0, 0, 0),  // Oct 2, 12:00 AM
      3: new Date(2026, 9, 3, 0, 0, 0),  // Oct 3, 12:00 AM
      4: null,                            // Stage 4 (scan.html) - Immediate after Stage 3
      5: new Date(2026, 9, 4, 0, 0, 0),  // Oct 4, 12:00 AM
      6: new Date(2026, 9, 5, 0, 0, 0),  // Oct 5, 12:00 AM
      7: new Date(2026, 9, 6, 0, 0, 0),  // Oct 6, 12:00 AM
      8: new Date(2026, 9, 7, 0, 0, 0),  // Oct 7, 12:00 AM
      9: new Date(2026, 9, 8, 0, 0, 0),  // Oct 8, 12:00 AM
      10: null                            // Stage 10 & Victory - Immediate after Stage 9
    };

    async function sendWebhook(stageNum) {
      if (!WEBHOOK_URL || WEBHOOK_URL === "YOUR_WEBHOOK_URL_HERE") return;
      const username = localStorage.getItem('username') || 'Unknown Agent';
      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content: `🎯 **Agent ${username}** has successfully completed **Stage ${stageNum}**!`
          }),
          keepalive: true
        });
      } catch (e) {
        console.error("Webhook error:", e);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const username = localStorage.getItem('username');
      const completedStage = parseInt(localStorage.getItem('completed_stage') || '0');

      if (!username) {
        window.location.href = "index.html";
        return;
      }

      const isMasterUser = username.trim().toLowerCase() === MASTER_USERNAME.toLowerCase();

      if (!isMasterUser && completedStage < (CURRENT_STAGE - 1)) {
        alert(`Agent ${username}, you must complete Stage ${CURRENT_STAGE - 1} first.`);
        window.location.href = "index.html";
      }
    });
  </script>
  <meta charset="UTF-8">

<body>

    <input type="text" id="answer" placeholder="Enter decrypted codename..." autocomplete="off">

  </div>

  <script>
    async function checkAnswer() {
      const val = document.getElementById('answer').value.trim().toLowerCase();
      if (val === 'charlie') {
        localStorage.setItem('completed_stage', '9');
        await sendWebhook(9);
        window.location.href = "stage10.html";

        alert("INCORRECT CODENAME. Shift each letter backward by 3 positions in the alphabet (F -> C)!");
      }
    }
